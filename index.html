
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarrafi Pro - سیستم مدیریت صرافی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            /* اعداد را تراز و هم‌اندازه نشان می‌دهد تا در ستون‌ها جابجا نشوند */
            font-variant-numeric: tabular-nums;
        }
        /* کلاس کمکی برای اعداد خرد و تراز */
        .num-xl { font-size: 1.75rem; line-height: 2rem; font-weight: 900; }
        .num-lg { font-size: 1.25rem; line-height: 1.75rem; font-weight: 900; }
        .num-sm { font-size: 0.875rem; line-height: 1.25rem; font-weight: 700; }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
    </style>
