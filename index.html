
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarrafi Pro - سیستم مدیریت صرافی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            /* فعال‌سازی اعداد هم‌عرض برای جلوگیری از جابجایی در ستون‌ها */
            font-variant-numeric: tabular-nums;
            -moz-font-feature-settings: "tnum";
            -webkit-font-feature-settings: "tnum";
            font-feature-settings: "tnum";
        }

        /* کلاس‌های اختصاصی برای کنترل دقیق اعداد */
        .tnum { font-variant-numeric: tabular-nums; }
        
        /* محدود کردن عرض محتوا برای جلوگیری از کشیدگی بیش از حد در مانیتورهای عریض */
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* اسکرول‌بار ظریف‌تر */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        /* انیمیشن ورود نرم */
        .fade-entry {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

}
